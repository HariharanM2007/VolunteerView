spring.application.name=demo

# Database (per SRS: injected securely via application.properties / environment overrides)
spring.datasource.url=jdbc:mysql://localhost:3306/volunteer_view?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (HS256, per SRS Section 11)
jwt.secret=${JWT_SECRET:c2VjcmV0S2V5Rm9ySGlyZUhpZ2hBcHBsaWNhdGlvbk11c3RCZUxvbmdFbm91Z2g=}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

server.port=8080
